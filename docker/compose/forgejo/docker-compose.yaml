name: forgejo_tempalte

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro

  forgejo:
    image: codeberg.org/forgejo/forgejo:13
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: ".env"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
    volumes:
      - ./forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '3000:3000'
      - '222:22'
    networks:
      - forgejo

  docker-in-docker:
    image: docker:dind
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    privileged: true
    restart: unless-stopped
    volumes:
      - ./docs-sites:/sites
    networks:
      - forgejo

  forgejo-runner:
    image: data.forgejo.org/forgejo/runner:12
    user: 1001:1001
    depends_on:
      - forgejo
      - docker-in-docker
    restart: unless-stopped

    # Use a dummy command to keep container alive for first-time registration
    command: "/bin/sh -c 'while : ; do sleep 1 ; done ;'"

    # Real command after the runner is registrated
#    command: '/bin/sh -c "sleep 5; forgejo-runner --config /data/config.yml daemon"'

    volumes:
      - ./forgejo-runner:/data
    networks:
      - forgejo
    links:
      - docker-in-docker

  caddy:
    image: caddy:latest
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./docs-sites:/srv/sites
    ports:
      - "3001:3001"
    networks:
      - forgejo

networks:
  forgejo:
    external: false